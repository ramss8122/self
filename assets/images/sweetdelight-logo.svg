<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="sdLogoPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF527B"/>
      <stop offset="50%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FFAFC5"/>
    </linearGradient>
    <linearGradient id="sdLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="sdLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFE4EC"/>
    </linearGradient>
    <filter id="sdLogoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FF527B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#sdLogoBg)" stroke="url(#sdLogoPink)" stroke-width="2" filter="url(#sdLogoShadow)"/>

    <!-- Lower Cake Tier (Base) -->
    <path d="M 17 50 C 17 47, 21 45, 32 45 C 43 45, 47 47, 47 50 L 46 55 C 46 57, 42 58, 32 58 C 22 58, 18 57, 18 55 Z" fill="url(#sdLogoPink)"/>
    
    <!-- Frosting line -->
    <path d="M 17 50 C 20 52, 24 52, 27 50 C 30 52, 34 52, 37 50 C 40 52, 44 52, 47 50" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Middle Tier -->
    <path d="M 21 38 C 21 35, 25 33, 32 33 C 39 33, 43 35, 43 38 L 42 44 C 42 46, 38 47, 32 47 C 26 47, 22 46, 22 44 Z" fill="#FFFFFF" stroke="url(#sdLogoPink)" stroke-width="1"/>

    <!-- 'S' Monogram Swirl Ribbon -->
    <path d="M 40 25 C 35 20, 24 21, 24 27 C 24 33, 41 32, 41 40 C 41 47, 28 48, 24 44" fill="none" stroke="url(#sdLogoPink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 40 25 C 35 20, 24 21, 24 27 C 24 33, 41 32, 41 40 C 41 47, 28 48, 24 44" fill="none" stroke="url(#sdLogoGold)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Crown Star Sparkle -->
    <path d="M 32 12 Q 32 17 28 18 Q 32 19 32 24 Q 32 19 36 18 Q 32 17 32 12 Z" fill="url(#sdLogoGold)"/>
    <circle cx="21" cy="18" r="1.5" fill="url(#sdLogoGold)"/>
    <circle cx="43" cy="16" r="1.8" fill="url(#sdLogoGold)"/>
  </g>

  <!-- Typography: SweetDelight -->
  <text x="88" y="48" font-family="'Playfair Display', 'Cinzel', serif" font-size="30" font-weight="700" fill="#2D2D2D" letter-spacing="-0.5">Sweet<tspan fill="#FF527B">Delight</tspan></text>
  <text x="90" y="64" font-family="'Nunito', 'Poppins', sans-serif" font-size="10" font-weight="700" fill="#999999" letter-spacing="3.5">ARTISAN PATISSERIE</text>
</svg>
