<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF527B"/>
      <stop offset="100%" stop-color="#FF758C"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFE4EC"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" stroke="url(#favPink)" stroke-width="2"/>

  <!-- Lower Cake Tier (Base) -->
  <path d="M 17 46 C 17 43, 21 41, 32 41 C 43 41, 47 43, 47 46 L 46 52 C 46 54, 42 55, 32 55 C 22 55, 18 54, 18 52 Z" fill="url(#favPink)"/>
  
  <!-- Frosting line -->
  <path d="M 17 46 C 20 48, 24 48, 27 46 C 30 48, 34 48, 37 46 C 40 48, 44 48, 47 46" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Middle Tier -->
  <path d="M 21 34 C 21 31, 25 29, 32 29 C 39 29, 43 31, 43 34 L 42 40 C 42 42, 38 43, 32 43 C 26 43, 22 42, 22 40 Z" fill="#FFFFFF" stroke="url(#favPink)" stroke-width="1"/>

  <!-- 'S' Monogram Swirl Ribbon -->
  <path d="M 40 22 C 35 17, 24 18, 24 24 C 24 30, 41 29, 41 37 C 41 44, 28 45, 24 41" fill="none" stroke="url(#favPink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 40 22 C 35 17, 24 18, 24 24 C 24 30, 41 29, 41 37 C 41 44, 28 45, 24 41" fill="none" stroke="url(#favGold)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crown Star Sparkle -->
  <path d="M 32 9 Q 32 14 28 15 Q 32 16 32 21 Q 32 16 36 15 Q 32 14 32 9 Z" fill="url(#favGold)"/>
  <circle cx="21" cy="15" r="1.5" fill="url(#favGold)"/>
  <circle cx="43" cy="13" r="1.8" fill="url(#favGold)"/>
</svg>
